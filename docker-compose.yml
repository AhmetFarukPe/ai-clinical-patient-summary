services:
  backend:
    build:
      context: ./App_Backend
      dockerfile: Dockerfile
    container_name: ai-triyaj-backend
    ports:
      - "8000:8000"
    environment:
      HASTANE_DB_FILE: /data/hastane_yerel.db
      GROQ_API_KEY: ${GROQ_API_KEY}
      KIOSK_API_KEY: ${KIOSK_API_KEY:-}
    volumes:
      - hospital_data:/data
    restart: unless-stopped

volumes:
  hospital_data:
